version: '3.8'

services:
  # PostgreSQL database with PostGIS extension
  database:
    # Multi-arch (linux/amd64 + linux/arm64): runs natively on Apple Silicon
    # instead of under qemu emulation. postgis/postgis publishes amd64 only --
    # every tag, by design ("Supported architecture: amd64" in its README) --
    # which is why the previous postgis/postgis:15-3.3 drew a platform-mismatch
    # warning on an M-series Mac. imresamu/postgis is the multi-arch build of
    # the same upstream Dockerfiles, maintained by a postgis/docker-postgis
    # maintainer. Postgres major stays 15, so an existing postgres_data volume
    # is still readable; PostGIS moves 3.3 -> 3.5, both 3.x as schema.sql needs.
    image: imresamu/postgis:15-3.5
    # Official image, amd64 only. Swap back if you want the postgis-org build
    # and don't mind emulation on arm64:
    # image: postgis/postgis:15-3.3
    container_name: wildfire_db
    environment:
      POSTGRES_DB: wildfire_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # C++ Simulator
  #
  # There is no separate simulator service: it existed only to be a target for
  # `docker exec` from the API (its command was `tail -f /dev/null`), which
  # required mounting the host's docker socket into the API container. The
  # simulator binary is now built into the API image by docker/Dockerfile.api
  # and run as a subprocess. docker/Dockerfile.simulator is kept as a
  # standalone build/run environment for CLI use.

  # Flask API (also runs the simulator)
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: wildfire_api
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "5001:5000"
    volumes:
      - ./api:/app/api
      - ./data:/app/data
      - ./output:/app/output
    environment:
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: wildfire_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      SIMULATOR_BIN: /usr/local/bin/wildfire_simulator
      DATA_DIR: /app/data
      OUTPUT_DIR: /app/output
      # At most this many simulations run at once; the rest queue as 'pending'.
      SIM_MAX_WORKERS: 2
      SIM_TIMEOUT_SECONDS: 3600
      # Threads per simulation. SIM_MAX_WORKERS * OMP_NUM_THREADS is the peak
      # core demand, so keep the product at or below the host's core count.
      OMP_NUM_THREADS: 4
      FLASK_ENV: development
    command: python /app/api/app.py

  # Nginx for serving frontend
  frontend:
    image: nginx:alpine
    container_name: wildfire_frontend
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

volumes:
  postgres_data:
