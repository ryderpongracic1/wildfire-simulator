version: '3.8'

services:
  # PostgreSQL database with PostGIS extension
  database:
    image: postgis/postgis:15-3.3
    container_name: wildfire_db
    environment:
      POSTGRES_DB: wildfire_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # C++ Simulator (build and run)
  simulator:
    build:
      context: .
      dockerfile: docker/Dockerfile.simulator
    container_name: wildfire_simulator
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./output:/app/output
    environment:
      OMP_NUM_THREADS: 8
    command: tail -f /dev/null  # Keep container running

  # Flask API
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: wildfire_api
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "5001:5000"
    volumes:
      - ./api:/app/api
      - ./cpp:/app/cpp
      - ./data:/app/data
      - ./output:/app/output
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: wildfire_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      SIMULATOR_BIN: /app/cpp/build/wildfire_simulator
      DATA_DIR: /app/data
      OUTPUT_DIR: /app/output
      FLASK_ENV: development
    command: python /app/api/app.py

  # Nginx for serving frontend
  frontend:
    image: nginx:alpine
    container_name: wildfire_frontend
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

volumes:
  postgres_data:
